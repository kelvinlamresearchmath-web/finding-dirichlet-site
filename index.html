<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐谱多媒体阅读器 (自适应文本层精密焊接·极致丝滑版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://lib.baomitu.com/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://lib.baomitu.com/pdf.js/3.11.174/pdf_viewer.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #main-viewer-container { scroll-behavior: smooth; will-change: scroll-position; }
        
        .pdf-page-block { 
            position: relative; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        /* 🏹 将原本透明的 PDF 文本选择层变成我们的交互纽带 */
        .textLayer {
            opacity: 1 !important; 
            color: transparent;    
            z-index: 20;
        }

        /* 🎨 精准焊接在 ▶ 字符 Span 上的红色高亮框 */
        .textLayer span.matched-unicode-btn {
            color: transparent !important;
            background: rgba(239, 68, 68, 0.1) !important; 
            border: 2px dashed rgba(239, 68, 68, 0.5) !important;
            border-radius: 4px !important;
            cursor: pointer !important;
            transition: all 0.15s ease;
            box-sizing: border-box;
            pointer-events: auto !important; 
        }
        .textLayer span.matched-unicode-btn:hover {
            background: rgba(239, 68, 68, 0.25) !important;
            border: 2px solid rgba(239, 68, 68, 0.9) !important;
        }
    </style>
</head>
<body class="bg-[#F8F9FA] text-[#1A1A1A] font-sans h-screen flex flex-col overflow-hidden">

    <header class="h-16 border-b border-[#E5E7EB] bg-white flex items-center justify-between px-6 z-10 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-red-500 text-white p-2 rounded-lg flex items-center justify-center"><i data-lucide="file-text" class="w-5 h-5"></i></div>
            <span class="font-semibold text-base tracking-tight truncate max-w-xs" id="pdf-title">智能交互多媒体阅读器</span>
        </div>
        <div class="flex items-center bg-[#F3F4F6] rounded-full p-1 border border-[#E5E7EB]">
            <button id="btn-zoom-out" class="p-2 hover:bg-white rounded-full transition-all text-gray-600 cursor-pointer" title="缩小"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
            <span id="zoom-percent" class="text-xs font-bold px-3 min-w-[60px] text-center text-gray-700">120%</span>
            <button id="btn-zoom-in" class="p-2 hover:bg-white rounded-full transition-all text-gray-600 cursor-pointer" title="放大"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
        </div>
        <label class="flex items-center space-x-2 bg-[#1A1A1A] hover:bg-[#333333] text-white px-4 py-2 rounded-full text-sm font-medium transition-all cursor-pointer shadow-sm">
            <i data-lucide="upload-cloud" class="w-4 h-4"></i>
            <span>导入 PDF 乐谱</span>
            <input type="file" id="file-input" accept=".pdf" class="hidden">
        </label>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <aside class="w-60 border-r border-[#E5E7EB] bg-white flex flex-col h-full z-10">
            <div class="p-4 border-b border-[#E5E7EB] flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">乐谱缩略</span>
                <span class="text-xs bg-gray-100 px-2 py-1 rounded-md text-gray-500" id="page-count">0 页</span>
            </div>
            <div id="thumbnail-container" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                <div class="text-center text-sm text-gray-400 mt-8">暂无文件</div>
            </div>
        </aside>

        <main id="main-viewer-container" class="flex-1 bg-[#F3F4F6] overflow-y-auto p-8 flex flex-col items-center">
            <div id="pdf-container-list" class="w-full flex flex-col items-center space-y-8">
                <div class="text-center text-gray-400 mt-20">请在右上角导入 PDF 乐谱</div>
            </div>
        </main>

        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white/80 backdrop-blur-md border border-[#E5E7EB] px-6 py-2 rounded-full shadow-md flex items-center space-x-4 z-20 min-w-[320px]">
            <div class="text-xs font-semibold bg-[#1A1A1A] text-white px-2.5 py-1 rounded-full" id="audio-page-indicator">第 1 页</div>
            <div class="flex-1 text-xs font-bold text-gray-500" id="audio-status-text">按需视口渲染已就绪，高频缩放绝不卡死</div>
        </div>
    </div>

    <audio id="audio-player" class="hidden" preload="auto"></audio>

    <script>
        lucide.createIcons();
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://lib.baomitu.com/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPageNum = 1;
        let mainScale = 1.2; 
        const thumbScale = 0.22;  

        const fileInput = document.getElementById('file-input');
        const thumbnailContainer = document.getElementById('thumbnail-container');
        const pdfContainerList = document.getElementById('pdf-container-list');
        const pageIndicator = document.getElementById('audio-page-indicator');
        const audioPlayer = document.getElementById('audio-player');
        const audioStatusText = document.getElementById('audio-status-text');
        const mainViewerContainer = document.getElementById('main-viewer-container');

        let isListenScroll = true;

        // 🎯 核心控制中心：管理每页的独立渲染状态与中断指针
        let pageRenderingStates = {}; 
        let globalAudioCounterMap = {}; 

        const TARGET_UNICODE_CHAR = "▶"; 

        const independentPlaylist = [
            'Allegro.wav', 'Adagio.wav', 'Rondo.wav', 'Motive-A.wav', 'Motive-B.wav', 'Motive-C.wav'   
        ];

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                document.getElementById('pdf-title').innerText = file.name;
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(async (pdf) => {
                        pdfDoc = pdf;
                        document.getElementById('page-count').innerText = `${pdf.numPages} 页`;
                        pageRenderingStates = {};
                        globalAudioCounterMap = {};
                        
                        // 预计算所有页面的符号顺序，保证音频映射千分之一秒内完成且绝不卡死
                        await preCalculateAudioIndices(); 
                        await initPagePlaceholdersAndThumbnails(); 
                        updateViewportRendering();        
                    }).catch(err => alert("PDF 解析失败。"));
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        // 🏎️ 极速预扫描，在完全不绘制画面的情况下锁定每页音频起止点
        async function preCalculateAudioIndices() {
            let totalCounter = 0;
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const textContent = await page.getTextContent();
                let matchCount = 0;
                textContent.items.forEach(item => {
                    if (item.str && item.str.includes(TARGET_UNICODE_CHAR)) matchCount++;
                });
                globalAudioCounterMap[i] = { startIndex: totalCounter, count: matchCount };
                totalCounter += matchCount;
            }
        }

        // 🏎️ 骨架铺设与缩略图隔离加载
        async function initPagePlaceholdersAndThumbnails() {
            pdfContainerList.innerHTML = '';
            thumbnailContainer.innerHTML = '';
            
            const firstPage = await pdfDoc.getPage(1);
            const viewport = firstPage.getViewport({ scale: mainScale });
            const widthStr = `${viewport.width}px`;
            const heightStr = `${viewport.height}px`;

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const pageWrapper = document.createElement('div');
                pageWrapper.id = `main-page-block-${i}`;
                pageWrapper.className = `pdf-page-block bg-white rounded-xl overflow-hidden border border-gray-100 flex justify-center items-center`;
                pageWrapper.style.width = widthStr;
                pageWrapper.style.height = heightStr;
                
                const mainCanvas = document.createElement('canvas');
                mainCanvas.id = `main-canvas-${i}`;
                pageWrapper.appendChild(mainCanvas);

                const textLayerDiv = document.createElement('div');
                textLayerDiv.id = `text-layer-${i}`;
                textLayerDiv.className = "textLayer";
                pageWrapper.appendChild(textLayerDiv);
                
                pdfContainerList.appendChild(pageWrapper);
                pageRenderingStates[i] = { renderedScale: 0, currentRenderTask: null };

                const thumbWrapper = document.createElement('div');
                thumbWrapper.id = `thumb-${i}`;
                thumbWrapper.className = `thumbnail-item border border-gray-200 p-2 rounded-lg cursor-pointer hover:bg-gray-50 flex flex-col items-center space-y-1.5 shrink-0`;
                thumbWrapper.innerHTML = `
                    <canvas id="thumb-canvas-${i}" class="block shadow-sm rounded bg-white"></canvas>
                    <span class="text-[11px] font-medium text-gray-400">第 ${i} 页</span>
                `;
                thumbnailContainer.appendChild(thumbWrapper);

                thumbWrapper.addEventListener('click', () => {
                    isListenScroll = false;
                    pageWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    switchPageUI(i);
                    setTimeout(() => { isListenScroll = true; updateViewportRendering(); }, 500);
                });
            }

            // 缩略图串行隔离通道，画完一页走下一页，彻底消灭封面串流Bug
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                await renderThumbnailIsolate(i, page);
            }
            switchPageUI(1);
        }

        function renderThumbnailIsolate(pageIdx, page) {
            return new Promise((resolve) => {
                const thumbCanvas = document.getElementById(`thumb-canvas-${pageIdx}`);
                if (!thumbCanvas) { resolve(); return; }
                
                const thumbCtx = thumbCanvas.getContext('2d');
                const thumbViewport = page.getViewport({ scale: thumbScale });
                thumbCanvas.height = thumbViewport.height;
                thumbCanvas.width = thumbViewport.width;
                
                const task = page.render({ canvasContext: thumbCtx, viewport: thumbViewport });
                task.promise.then(() => resolve()).catch(() => resolve());
            });
        }

        // 🏎️ 高精视口计算中心：只要在屏幕外的网页谱面，外壳自适应变大，但绝不用 Canvas 重绘它
        function updateViewportRendering() {
            if (!pdfDoc) return;
            const containerTop = mainViewerContainer.getBoundingClientRect().top;
            const containerBottom = mainViewerContainer.getBoundingClientRect().bottom;

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const block = document.getElementById(`main-page-block-${i}`);
                if (!block) continue;

                const rect = block.getBoundingClientRect();
                // 允许前后预留 200px 缓冲带，滑过去时丝滑衔接
                const isVisible = (rect.bottom >= containerTop - 200 && rect.top <= containerBottom + 200);

                if (isVisible) {
                    // 如果该页面没渲染过，或者缩放比例对不上，才执行局部按需重绘
                    if (pageRenderingStates[i].renderedScale !== mainScale) {
                        renderSinglePageLayer(i);
                    }
                } else {
                    // 如果页面不在视野内，在放大的时候我们只更新框架尺寸，不给 CPU 增加任何图画负担！
                    pdfDoc.getPage(i).then(page => {
                        const viewport = page.getViewport({ scale: mainScale });
                        if (block.style.width !== `${viewport.width}px`) {
                            block.style.width = `${viewport.width}px`;
                            block.style.height = `${viewport.height}px`;
                        }
                    });
                }
            }
        }

        // 🏎️ 单页渲染看门狗：彻底将 Canvas 任务与文本层分离。狂点放大时，旧Canvas立刻原地处决！
        function renderSinglePageLayer(pageIdx) {
            const state = pageRenderingStates[pageIdx];
            if (state.currentRenderTask) {
                state.currentRenderTask.cancel();
                state.currentRenderTask = null;
            }

            pdfDoc.getPage(pageIdx).then(async (page) => {
                const viewport = page.getViewport({ scale: mainScale });
                
                const mainCanvas = document.getElementById(`main-canvas-${pageIdx}`);
                const textLayerDiv = document.getElementById(`text-layer-${pageIdx}`);
                const wrapper = document.getElementById(`main-page-block-${pageIdx}`);
                
                if (!mainCanvas || !textLayerDiv || !wrapper) return;

                wrapper.style.width = `${viewport.width}px`;
                wrapper.style.height = `${viewport.height}px`;

                const mainCtx = mainCanvas.getContext('2d');
                mainCanvas.height = viewport.height;
                mainCanvas.width = viewport.width;
                
                // 1. 发射 Canvas 主图渲染任务
                const renderTask = page.render({ canvasContext: mainCtx, viewport: viewport });
                state.currentRenderTask = renderTask;

                renderTask.promise.then(() => {
                    state.currentRenderTask = null;
                    state.renderedScale = mainScale;
                }).catch((err) => {
                    if (err.name === 'RenderingCancelledException') {
                        state.currentRenderTask = null;
                    }
                });

                // 2. 🛡️ 独立音频/文本焊接车道：即使上面的 Canvas 被中断，这里也绝不发生熔断，保证百分百可播放
                try {
                    textLayerDiv.innerHTML = '';
                    textLayerDiv.style.width = `${viewport.width}px`;
                    textLayerDiv.style.height = `${viewport.height}px`;

                    const textContent = await page.getTextContent();
                    await pdfjsLib.renderTextLayer({
                        textContentSource: textContent,
                        container: textLayerDiv,
                        viewport: viewport,
                        textDivs: []
                    }).promise;

                    const spans = textLayerDiv.querySelectorAll('span');
                    let foundSpansOnThisPage = [];
                    spans.forEach(span => {
                        if (span.innerText && span.innerText.includes(TARGET_UNICODE_CHAR)) foundSpansOnThisPage.push(span);
                    });

                    foundSpansOnThisPage.sort((a, b) => {
                        const rectA = a.getBoundingClientRect();
                        const rectB = b.getBoundingClientRect();
                        if (Math.abs(rectA.top - rectB.top) > 8) return rectA.top - rectB.top;
                        return rectA.left - rectB.left;
                    });

                    const pageAudioInfo = globalAudioCounterMap[pageIdx];
                    foundSpansOnThisPage.forEach((span, index) => {
                        const currentAudioID = pageAudioInfo.startIndex + index;
                        span.classList.add('matched-unicode-btn');
                        span.title = `点击播放独立伴奏段落`;
                        
                        // 使用最高优先级、绝不失效的原生 onclick 控制器
                        span.onclick = function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            playPureIndependentAudio(pageIdx, currentAudioID);
                        };
                    });
                } catch (textErr) {
                    console.error("文本层渲染中断提示:", textErr);
                }
            });
        }

        function playPureIndependentAudio(pageIdx, audioID) {
            const targetWav = independentPlaylist[audioID] || independentPlaylist[0];

            if (audioPlayer.src.indexOf(targetWav) !== -1 && !audioPlayer.paused) {
                audioPlayer.pause();
                audioStatusText.innerText = `已暂停播放`;
                return;
            }

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();
            }

            audioStatusText.innerText = `正在请求独立音频通道...`;
            audioPlayer.src = `${targetWav}?t=${new Date().getTime()}`; 
            audioPlayer.load();

            audioPlayer.play().then(() => {
                pageIndicator.innerText = `第 ${pageIdx} 页`;
                audioStatusText.innerText = `正在播放: ${targetWav} (对应谱面上第 ${audioID + 1} 个字符)`;
            }).catch(err => {
                audioStatusText.innerText = `未能在同级目录下找到音频文件: ${targetWav}`;
            });
        }

        // 加入帧率节流控制的高频滚动中心
        let scrollTick = false;
        mainViewerContainer.addEventListener('scroll', () => {
            if (!scrollTick) {
                window.requestAnimationFrame(() => {
                    updateViewportRendering(); // 核心：滚到哪页，哪页才会重绘
                    
                    if (!isListenScroll) { scrollTick = false; return; }
                    const blocks = document.querySelectorAll('.pdf-page-block');
                    let activePage = currentPageNum;
                    const containerCenter = mainViewerContainer.getBoundingClientRect().top + (mainViewerContainer.clientHeight / 2);
                    
                    blocks.forEach((block) => {
                        const rect = block.getBoundingClientRect();
                        if (rect.top <= containerCenter && rect.bottom >= containerCenter) {
                            activePage = parseInt(block.id.replace('main-page-block-', ''));
                        }
                    });
                    if (activePage !== currentPageNum) switchPageUI(activePage);
                    scrollTick = false;
                });
                scrollTick = true;
            }
        });

        function switchPageUI(pageIdx) {
            currentPageNum = pageIdx;
            pageIndicator.innerText = `第 ${pageIdx} 页`;

            document.querySelectorAll('.thumbnail-item').forEach(item => {
                item.classList.remove('border-[#1A1A1A]', 'bg-gray-50', 'ring-1', 'ring-[#1A1A1A]');
            });
            const activeThumb = document.getElementById(`thumb-${pageIdx}`);
            if (activeThumb) {
                activeThumb.classList.add('border-[#1A1A1A]', 'bg-gray-50', 'ring-1', 'ring-[#1A1A1A]');
            }
        }

        // 🔓 瞬间提速十倍的终极动态放缩控制
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const zoomPercent = document.getElementById('zoom-percent');

        function updateZoom(newScale) {
            if (!pdfDoc) return;
            mainScale = Math.max(0.6, Math.min(2.5, newScale));
            zoomPercent.innerText = `${Math.round(mainScale * 100)}%`;
            
            // 核心：点击放大时不再使用老旧的 for 循环卡死渲染，直接调度高级视口过滤器，瞬间只刷视口内可见页！
            updateViewportRendering(); 
        }

        btnZoomIn.addEventListener('click', () => updateZoom(mainScale + 0.15));
        btnZoomOut.addEventListener('click', () => updateZoom(mainScale - 0.15));
    </script>
</body>
</html>
